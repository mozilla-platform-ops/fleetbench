[package]
name = "fleetbench"
version = "0.4.6"
edition = "2021"
description = "Cross-platform CPU benchmark collector for performance-testing fleets"
license = "MPL-2.0"

[[bin]]
name = "fleetbench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rayon = "1"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Performance",
    "Win32_Foundation",
] }

[profile.release]
lto = "thin"
codegen-units = 1
