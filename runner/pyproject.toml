[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetbench-run"
version = "0.1.0"
description = "Runner wrapper that invokes the fleetbench collector and persists results"
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
dependencies = []

[project.scripts]
fleetbench-run = "fleetbench_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]
